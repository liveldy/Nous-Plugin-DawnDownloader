<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>全能下载器</title></head><body>
<main><section class="download-entry"><div class="entry-top"><div><h1>把链接交给 YunX</h1><p>网盘、视频与直链下载，由本机云析处理。</p></div><span id="platform" class="platform"></span></div>
<form id="submit"><label for="link">下载链接或分享内容</label><textarea id="link" rows="5" maxlength="30000" placeholder="粘贴链接，可包含提取码" required></textarea><div class="entry-actions"><label id="direct-row" class="check"><input type="checkbox" id="direct">直接下载文件链接</label><button type="submit" id="send" class="primary">交给 YunX</button></div></form><p id="feedback" class="feedback" role="status"></p></section>
<section class="native-program"><div class="program-header"><div><h2>本机云析</h2><p id="version">正在读取平台信息…</p></div><button id="refresh" class="text-button">刷新状态</button></div><div class="program-status"><span id="state">正在检查安装状态…</span><div><button id="install">安装原版程序</button><button id="open" disabled>打开 YunX</button></div></div><progress id="progress" hidden max="100" value="0"></progress><p id="installation-note" class="note">安装会打开系统安装界面，按提示完成后刷新状态。</p></section>
<section class="handoff"><h2>下载在哪里继续？</h2><div class="handoff-row"><span>链接解析</span><p>在 YunX 中选择网盘、视频解析或下载方式。</p></div><div class="handoff-row"><span>下载与文件</span><p>进度、暂停、重试和保存目录由原版 YunX 管理。</p></div><div class="handoff-row"><span>本机连接</span><p id="transport">独立运行，不读取 Nous 的模型密钥与对话。</p></div></section>
<footer><span>全能下载器 1.0.0 · AGPL-3.0</span><div><button id="source" class="text-button">源码与许可</button><button id="upstream" class="text-button">上游项目</button></div></footer></main>
<script src="nous-plugin.js"></script><script src="app.js"></script></body></html>
